name: Collect GitHub snapshots

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      per_query:
        description: Repositories returned per discovery query
        default: "25"
        required: true

permissions:
  contents: read

concurrency:
  group: github-snapshot-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Collect snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN }}
          PER_QUERY: ${{ inputs.per_query || '25' }}
        run: radar collect --database radar.db --per-query "$PER_QUERY"
      - uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot-${{ github.run_id }}
          path: radar.db
          retention-days: 14
