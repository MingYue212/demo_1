name: Collect GitHub snapshots

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      per_query:
        description: Repositories returned per discovery query
        default: "25"
        required: true

permissions:
  contents: read

concurrency:
  group: github-snapshot-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector
        env:
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
        run: |
          if [ -n "${RADAR_DATABASE_URL:-}" ]; then
            python -m pip install ".[postgres]"
          else
            python -m pip install .
          fi
      - name: Collect snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN }}
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          PER_QUERY: ${{ inputs.per_query || '25' }}
        run: |
          if [ -n "${RADAR_DATABASE_URL:-}" ]; then
            radar collect --database-url "$RADAR_DATABASE_URL" --per-query "$PER_QUERY"
          else
            radar collect --database radar.db --per-query "$PER_QUERY"
          fi
      - name: Calculate trend scores
        env:
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
        run: |
          if [ -n "${RADAR_DATABASE_URL:-}" ]; then
            radar score --database-url "$RADAR_DATABASE_URL"
          else
            radar score --database radar.db
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot-${{ github.run_id }}
          path: radar.db
          retention-days: 14
          if-no-files-found: ignore
