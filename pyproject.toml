[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tech-radar"
version = "0.1.0"
description = "Collect reproducible GitHub snapshots for AI Tech Radar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
