[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tech-radar"
version = "0.1.0"
description = "Collect reproducible GitHub snapshots for AI Tech Radar"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radar.migrations" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
